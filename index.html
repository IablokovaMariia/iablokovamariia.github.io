
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iablokova Mariia | Portfolio</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: #fafafa;
      color: #111;
      font-family: 'Outfit', sans-serif;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 32px 5%;
      font-size: 22px;
      font-weight: 500;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 70px 5%;
    }

    .eyebrow {
      font-size: 13px;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 30px;
    }

    h1 {
      font-size: clamp(48px, 8vw, 120px);
      font-weight: 400;
      line-height: 1.05;
      letter-spacing: -0.055em;
      max-width: 1100px;
    }

    .description {
      font-size: clamp(16px, 1.5vw, 22px);
      color: #777;
      font-weight: 300;
      margin-top: 35px;
    }

    footer {
      padding: 30px 5%;
      display: flex;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
      font-size: 13px;
      color: #777;
    }

    @media (max-width: 600px) {
      header { padding-top: 24px; }
      main { padding-top: 40px; padding-bottom: 40px; }
      footer { font-size: 12px; }
    }
  </style>
</head>

<body>
  <header>Iablokova Mariia</header>

  <main>
    <p class="eyebrow">Portfolio / 2026</p>
    <h1>Good design<br>takes time.</h1>
    <p class="description">
      I'm putting the finishing touches on portfolio. My works in UX/UI, visual identity, and digital design will be available here soon.<br>
      Please check back later.
    </p>
  </main>

  <footer>
    <span>UX/UI · Visual Design · Branding</span>
    <span>© 2026 Iablokova Mariia</span>
  </footer>
</body>
</html>
